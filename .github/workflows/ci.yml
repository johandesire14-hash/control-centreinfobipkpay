name: WapiGarage CI

on:
  push:
    branches: [main, security-hardening]
  pull_request:
    branches: [main]

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Typecheck database package
        run: pnpm --filter @workspace/db exec tsc -p tsconfig.json

      - name: Typecheck API
        run: pnpm --filter @workspace/api-server run typecheck

      - name: Build API
        run: pnpm --filter @workspace/api-server run build

      - name: Typecheck mobile
        run: pnpm --filter @workspace/mobile exec tsc --noEmit --pretty false

      - name: Security contract tests
        run: pnpm test:security-contracts
